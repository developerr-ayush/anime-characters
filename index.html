<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#060410">
    <title>Date · Marry · Kill — Anime Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

    <!-- Ambient background -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app-wrap">

        <!-- ===== GAME SCREEN ===== -->
        <div class="game" id="game">

            <header class="game-header">
                <div class="title-wrap">
                    <h1 class="game-title">Date · Marry · Kill</h1>
                    <p class="game-subtitle">Anime Edition</p>
                </div>
                <div class="round-meta">
                    <span class="round-badge" id="roundName">—</span>
                    <span class="trio-counter" id="trioCounter">Trio 1 / 10</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:0%"></div>
                </div>
            </header>

            <div class="hint" id="hint">
                <span class="hint-icon">👆</span>
                <span>Tap a character, then tap a zone</span>
            </div>

            <div class="characters" id="characters"></div>

            <div class="zones">
                <div class="zone" data-zone="date">
                    <div class="zone-icon">💕</div>
                    <div class="zone-label">Date</div>
                </div>
                <div class="zone" data-zone="marry">
                    <div class="zone-icon">💍</div>
                    <div class="zone-label">Marry</div>
                </div>
                <div class="zone" data-zone="kill">
                    <div class="zone-icon">💀</div>
                    <div class="zone-label">Kill</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-ghost" id="resetBtn">↺ Reset</button>
                <button class="btn btn-primary" id="nextBtn" disabled>Next →</button>
            </div>

        </div>

        <!-- ===== SUMMARY SCREEN ===== -->
        <div class="summary hidden" id="summary">
            <div class="summary-header">
                <h2 class="summary-title">Your Final Choices</h2>
                <p class="summary-sub">🎬 Here's the verdict</p>
            </div>
            <div id="summaryContent"></div>
            <div class="summary-footer">
                <button class="btn btn-primary btn-lg" id="restartBtn">↺ Play Again</button>
            </div>
        </div>

    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
